services:
  - type: web
    name: stock-predictor-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: ENVIRONMENT
        value: prod
      - key: MONGO_URI
        sync: false
      - key: TWELVEDATA_API_KEY
        sync: false
